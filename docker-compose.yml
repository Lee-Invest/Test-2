services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apexfund
      POSTGRES_PASSWORD: apexfund
      POSTGRES_DB: apexfund
    ports:
      - "5432:5432"
    volumes:
      - apexfund_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexfund"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apexfund_pgdata:
